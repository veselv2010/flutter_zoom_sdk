plugins {
    id "maven-publish"
}

def sdkDependencies = libs.bundles.zoomSdk.get().collect {
    [group: it.module.group, name: it.module.name,
     version: it.versionConstraint.requiredVersion]
}

publishing {
    publications {
        common(MavenPublication) {
            groupId = "online.studyrooms"
            artifactId = "mobilertc"
            version = libs.versions.zoomSdk.get()
            artifact(file("mobilertc.aar"))
            pom.packaging = "aar"

            // A prebuilt AAR needs explicit dependency metadata in its POM.
            pom.withXml {
                def dependencies = asNode().appendNode("dependencies")
                sdkDependencies.each { dependency ->
                    def node = dependencies.appendNode("dependency")
                    node.appendNode("groupId", dependency.group)
                    node.appendNode("artifactId", dependency.name)
                    node.appendNode("version", dependency.version)
                    node.appendNode("scope", "compile")
                }
            }
        }
    }
}
