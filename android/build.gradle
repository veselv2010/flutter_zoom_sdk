plugins {
    id "com.android.library"
}

group = "com.evilratt.flutter_zoom_sdk"
version = "1.0"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal {
            content {
                includeModule("online.studyrooms", "mobilertc")
            }
        }
    }
}

android {
    namespace = "com.evilratt.flutter_zoom_sdk"
    compileSdk = 36

    defaultConfig {
        minSdk = 28
        vectorDrawables.useSupportLibrary = true
        consumerProguardFiles("proguard.txt")
    }

    lint {
        disable += "InvalidPackage"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation("online.studyrooms:mobilertc:7.2.5.45150")
}

if (project == rootProject) {
    tasks.register("deployAllToMavenLocal") {
        dependsOn(":mobilertc:publishToMavenLocal")
    }
}
